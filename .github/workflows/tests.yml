name: Forever tests and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: npm run test:lua
        env:
          GCP_LUA51: lua5.1
      - uses: actions/upload-artifact@v4
        with:
          name: GuildCopilotForever-beta
          path: |
            build/*.zip
            build/SHA256.json
